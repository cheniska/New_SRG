<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRQuest — просмотрщик квестов</title>
<style>
:root{color-scheme:dark;font:16px/1.55 system-ui,sans-serif;background:#101827;color:#e9eef7}*{box-sizing:border-box}body{margin:0}header{padding:16px 22px;background:#18243a;border-bottom:1px solid #35445c}h1{font-size:22px;margin:0}small,.muted{color:#aab8cd}main{display:grid;grid-template-columns:minmax(230px,310px) minmax(0,1fr);min-height:calc(100vh - 80px)}aside{border-right:1px solid #35445c;padding:15px;max-height:calc(100vh - 80px);overflow:auto}article{padding:22px;max-width:1050px;width:100%;margin:auto}input,select,button{background:#22334e;color:#fff;border:1px solid #4a6385;border-radius:9px;padding:10px;font:inherit}input,select{width:100%;margin-bottom:10px}button{cursor:pointer;text-align:left}button:hover{background:#304e73}.quest{display:block;width:100%;margin:5px 0;padding:8px}.quest.active{background:#315c86}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.nav button{font-size:14px}.loc{background:#1a283e;border:1px solid #35445c;border-radius:12px;padding:20px;margin-top:14px}.prose{white-space:pre-wrap;overflow-wrap:anywhere}.prose p{margin:0 0 13px}.choice{display:block;width:100%;margin:10px 0;padding:12px;border-left:4px solid #6da9e6}.choice small{display:block;margin-top:5px}.error{color:#ffb7b7}mark{background:#aa7930;color:white}#status{margin:12px 0}a{color:#9bd0ff}@media(max-width:740px){main{display:block}aside{max-height:270px;border-right:0;border-bottom:1px solid #35445c}article{padding:14px}.loc{padding:13px}}
#graphPanel{position:fixed;inset:0;background:#101827;z-index:20;display:none;flex-direction:column}#graphPanel.open{display:flex}#graphHead{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#18243a}#graphCanvas{flex:1;overflow:auto}#graphCanvas svg{display:block;max-width:none}#graphPanel button{font-size:14px;padding:8px}details{margin-top:8px;font-size:13px;color:#aab8cd}summary{cursor:pointer}</style></head><body><header><h1>SRQuest — просмотрщик текстов</h1><small>Полные русские тексты • версия new • данные из cheniska/SR_TextQuests_Translation</small></header>
<main><aside><input id="filter" placeholder="Фильтр по названию файла"><div id="list">Загрузка списка…</div></aside>
<article><div id="status">Выберите квест слева.</div><div class="nav"><button id="back">← Назад</button><button id="start">К началу</button><select id="jump" style="width:auto;margin:0"><option>Локация</option></select></div><div class="nav"><button id="full">Показать весь исходный текст</button><button id="structured">Режим переходов</button><button id="graphOpen">Граф квеста</button></div><div id="view"></div><p class="muted">Исходные файлы не изменяются. Условия и эффекты отображаются, но игровой движок не эмулируется.</p></article></main><div id="graphPanel"><div id="graphHead"><strong style="margin-right:auto">Граф квеста</strong><button id="graphMinus">−</button><button id="graphPlus">+</button><button id="graphClose">Закрыть ✕</button></div><div id="graphCanvas"></div></div>
<script>
const repo='cheniska/SR_TextQuests_Translation',prefix='TextQuests/SRQuest_texts/',root='https://raw.githubusercontent.com/'+repo+'/main/'+prefix;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let files=[],current=null,locations={},history=[],at=1,search='',rawText='';
function name(p){return p.split('/').pop().replace(/^(resources|sharedassets0)\.assets_\d+_/,'').replace(/\.(txt|outline\.md)$/,'')}
async function get(url){let r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status+' — '+url);return r.text()}
function showList(){let v=$('filter').value.toLowerCase();$('list').innerHTML=files.filter(f=>name(f).toLowerCase().includes(v)).map(f=>'<button class="quest '+(f===current?'active':'')+'" data-file="'+esc(f)+'">'+esc(name(f))+'</button>').join('');$('list').querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>load(b.dataset.file))}
function parseText(t){const map={};let cur=null,variant=null;for(const line of t.replace(/^\uFEFF/,'').split(/\r\n|\n|\r/)){const m=line.match(/^\s*Loc(\d+)-(\d+)[\t ]*(.*)$/);if(m){cur=+m[1];variant={variant:+m[2],text:m[3]};(map[cur]??={texts:[],paths:[]}).texts.push(variant)}else if(cur!==null&&/^\s*\*/.test(line)&&variant){variant.text+='\n'+line.replace(/^\s*\*[\t ]?/,'')}}return map}
function parseOutline(t,map){let loc=null, path=null;for(let line of t.split(/\r?\n/)){let m=line.match(/^### Loc(\d+)\s*(.*)$/);if(m){loc=+m[1];map[loc]??={texts:[],paths:[]};map[loc].type=m[2];path=null;continue}if(loc===null)continue;m=line.match(/^  -> Path(\d+) => Loc(\d+)\s*(.*)$/);if(m){path={id:+m[1],target:+m[2],meta:m[3],text:'',details:[]};map[loc].paths.push(path);continue}if(path){m=line.match(/^\s+текст:\s*(.*)$/);if(m)path.text=m[1];else if(/^\s+(условия|эффект|ограничение|проходов|визитов)/.test(line))path.details.push(line.trim())}}}
function formatted(s){return esc(s).replace(/&lt;clr&gt;/g,'<strong>').replace(/&lt;clrEnd&gt;/g,'</strong>').replace(/&lt;[^&]*&gt;/g,m=>'<span class="muted">'+m+'</span>').replace(/\n/g,'<br>')}
function go(n,push=true){if(!locations[n])return $('status').textContent='Локация '+n+' не найдена';if(push)history.push(at);at=n;let l=locations[n];$('status').textContent=name(current)+' — Loc'+n+' '+(l.type||'');$('jump').value=n;let text=l.texts.map(x=>'<div class="prose"><small>Вариант '+x.variant+'</small><p>'+formatted(x.text)+'</p></div>').join('<hr style="border:0;border-top:1px solid #35445c">');if(!text)text='<p class="error">Текст локации отсутствует в загруженном TXT. Проверьте исходный файл.</p>';let choices=l.paths.map(p=>'<div class="choice"><button style="display:block;width:100%;border:0;background:transparent;padding:0" data-target="'+p.target+'">'+formatted(p.text||'Переход '+p.id)+'</button><details><summary>Условия и параметры · Path'+p.id+' → Loc'+p.target+'</summary><div>'+esc(p.meta||'')+'<br>'+p.details.map(esc).join('<br>')+'</div></details></div>').join('');$('view').innerHTML='<section class="loc"><h2>Локация '+n+'</h2>'+text+(choices||'<p class="muted">Переходов нет — завершение ветки.</p>')+'</section>';$('view').querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>go(+b.dataset.target));window.scrollTo({top:0,behavior:'instant'})}
async function load(f){current=f;history=[];at=1;showList();$('status').textContent='Загрузка '+name(f)+'…';$('view').innerHTML='';try{let outline=f.replace(/^quests_txt\//,'outline/').replace(/\.txt$/,'.outline.md');let txt=await get(root+f);let md='';try{md=await get(root+outline)}catch(e){console.warn('Outline недоступен, отображаем полный TXT',e)}rawText=txt;locations=parseText(txt);parseOutline(md,locations);let nums=Object.keys(locations).map(Number).sort((a,b)=>a-b);$('jump').innerHTML=nums.map(n=>'<option value="'+n+'">Loc'+n+'</option>').join('');go(nums.includes(1)?1:nums[0],false)}catch(e){$('status').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}
$('full').onclick=()=>{if(!rawText)return;$('status').textContent=name(current)+' — полный исходный текст';$('view').innerHTML='<section class="loc"><h2>Полный текст файла '+esc(name(current))+'</h2><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font:inherit">'+esc(rawText)+'</pre></section>'};$('structured').onclick=()=>go(at,false);
let graphScale=1;
function renderGraph(){
const ids=Object.keys(locations).map(Number).sort((a,b)=>a-b);if(!ids.length)return;
const levels=new Map([[ids.includes(1)?1:ids[0],0]]),queue=[...levels.keys()];
for(let i=0;i<queue.length;i++){const n=queue[i];for(const p of locations[n].paths)if(locations[p.target]&&!levels.has(p.target)){levels.set(p.target,Math.min(12,levels.get(n)+1));queue.push(p.target)}}
for(const n of ids)if(!levels.has(n))levels.set(n,13);
const cols=new Map(),pos=new Map(),dx=175,dy=66;
for(const n of ids){const lv=levels.get(n);if(!cols.has(lv))cols.set(lv,[]);cols.get(lv).push(n)}
for(const [lv,arr] of cols)arr.forEach((n,i)=>pos.set(n,{x:25+lv*dx,y:25+i*dy}));
const w=(Math.max(...cols.keys())+1)*dx+50,h=Math.max(...[...cols.values()].map(a=>a.length))*dy+60;
let edges='',nodes='';
for(const n of ids){const a=pos.get(n);for(const p of locations[n].paths){const b=pos.get(p.target);if(!b)continue;const x1=a.x+115,y1=a.y+20,x2=b.x,y2=b.y+20;edges+='<path d="M'+x1+' '+y1+' Q'+((x1+x2)/2)+' '+(Math.min(y1,y2)-20)+' '+x2+' '+y2+'" fill="none" stroke="#648bb8" stroke-width="1.5" marker-end="url(#arrow)"/>'}}
for(const n of ids){const a=pos.get(n),l=locations[n],active=n===at;nodes+='<g data-node="'+n+'" style="cursor:pointer"><rect x="'+a.x+'" y="'+a.y+'" width="115" height="40" rx="7" fill="'+(active?'#287eac':'#263b59')+'" stroke="#86a8cb"/><text x="'+(a.x+57)+'" y="'+(a.y+17)+'" text-anchor="middle" font-size="14" fill="white">Loc'+n+'</text><text x="'+(a.x+57)+'" y="'+(a.y+31)+'" text-anchor="middle" font-size="10" fill="#c2d0e0">'+esc((l.type||'').replace(/[\[\]]/g,'').slice(0,15))+'</text></g>'}
$('graphCanvas').innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="'+Math.round(w*graphScale)+'" height="'+Math.round(h*graphScale)+'" viewBox="0 0 '+w+' '+h+'"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#648bb8"/></marker></defs>'+edges+nodes+'</svg>';
$('graphCanvas').querySelectorAll('[data-node]').forEach(el=>el.onclick=()=>{go(+el.getAttribute('data-node'));$('graphPanel').classList.remove('open')});
}
$('graphOpen').onclick=()=>{if(!current)return;graphScale=.85;renderGraph();$('graphPanel').classList.add('open')};
$('graphClose').onclick=()=>$('graphPanel').classList.remove('open');
$('graphPlus').onclick=()=>{graphScale=Math.min(3,graphScale*1.3);renderGraph()};
$('graphMinus').onclick=()=>{graphScale=Math.max(.2,graphScale/1.3);renderGraph()};

$('back').onclick=()=>{if(history.length)go(history.pop(),false)};$('start').onclick=()=>{history=[];go(1,false)};$('jump').onchange=e=>go(+e.target.value);$('filter').oninput=showList;
(async()=>{try{let data=JSON.parse(await get('https://api.github.com/repos/'+repo+'/git/trees/main?recursive=1'));files=data.tree.filter(x=>x.type==='blob'&&x.path.startsWith(prefix+'quests_txt/new/ru/')&&x.path.endsWith('.txt')).map(x=>x.path.slice(prefix.length)).sort((a,b)=>name(a).localeCompare(name(b),'ru'));showList();$('status').textContent='Доступно файлов: '+files.length+'. Выберите файл слева.'}catch(e){$('list').innerHTML='<span class="error">Не удалось получить список: '+esc(e.message)+'</span>'}})();
</script></body></html>
