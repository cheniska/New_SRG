<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRQuest QMM Viewer</title><style>
:root{color-scheme:dark;font:16px/1.5 system-ui;background:#0d1524;color:#e8eff9}*{box-sizing:border-box}body{margin:0}header{padding:12px 16px;background:#1b2a40;border-bottom:1px solid #40536e}h1{font-size:20px;margin:0}small,.muted{color:#a9bdd3}main{display:grid;grid-template-columns:250px minmax(0,1fr);height:calc(100dvh - 80px)}aside{overflow:auto;border-right:1px solid #41516b;padding:12px}article{overflow:auto;padding:16px}button,input,select{font:inherit;border:1px solid #4c678a;border-radius:9px;background:#243753;color:white;padding:9px}button{cursor:pointer}button:hover{background:#385477}input{width:100%;margin-bottom:10px}.item{display:block;width:100%;text-align:left;margin:4px 0}.item.active{background:#31618b}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.card{border:1px solid #41516b;background:#192940;border-radius:12px;padding:18px;max-width:1050px}.prose{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}.variant{border-bottom:1px solid #34445e;padding:8px 0}.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-left:4px solid #72b1ed}.choice small{display:block}.error{color:#ffb2b2}details{margin:8px 0}#graph{position:fixed;inset:0;background:#101b2e;z-index:10;display:none;flex-direction:column}#graph.open{display:flex}#graphBar{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#1b2a40}#graphCanvas{flex:1;overflow:auto;touch-action:pan-x pan-y;overscroll-behavior:contain}#graphCanvas svg{display:block;max-width:none}#graphBar strong{margin-right:auto}mark{background:#855e22;color:white}@media(max-width:750px){main{display:flex;flex-direction:column;height:calc(100dvh - 80px)}aside{max-height:190px;flex:none;border-bottom:1px solid #41516b;border-right:0}article{flex:1;padding:12px}.card{padding:12px}}</style></head>
<body><header><h1>SRQuest — QMM-просмотрщик</h1><small>Исходные QMM · полные тексты · оригинальные координаты графа</small></header><main><aside><input id="filter" placeholder="Найти квест"><div id="list">Загрузка…</div></aside><article><div id="status">Выберите квест</div><div class="toolbar"><button id="back">← Назад</button><button id="home">Старт</button><select id="jump"><option>Локация</option></select><button id="graphOpen">Граф</button><button id="all">Все тексты</button><button id="one">Одна локация</button></div><div id="content"></div><p class="muted">Просмотр структуры, не игровой симулятор. Условия и параметры не вычисляются. Тексты и данные считываются из оригинальных QMM.</p></article></main>
<div id="graph"><div id="graphBar"><strong>Граф QMM</strong><button id="zoomOut">−</button><button id="zoomIn">+</button><button id="zoomFit">Вписать</button><button id="graphClose">Закрыть ✕</button></div><div id="graphCanvas"></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const repo='cheniska/SR_TextQuests_Translation',prefix='TextQuests/SRQuest_texts/qmm/new/ru/',base='https://raw.githubusercontent.com/'+repo+'/main/'+prefix;
let files=[],selected='',q=null,locs=new Map(),history=[],here=1,scale=1;
const nm=p=>p.split('/').pop().replace(/^(resources|sharedassets0)\.assets_\d+_/,'').replace(/\.qmm$/,'');
class Reader{
constructor(buffer){this.b=new DataView(buffer);this.pos=0;this.decoder=new TextDecoder('utf-16le',{fatal:false})}
need(n){if(n<0||this.pos+n>this.b.byteLength)throw Error('Неверная структура QMM, позиция '+this.pos)}
i(){this.need(4);const x=this.b.getInt32(this.pos,true);this.pos+=4;return x}
u(){this.need(1);return this.b.getUint8(this.pos++)}
skip(n){this.need(n);this.pos+=n}
tf(){const n=this.i();if(n<0||n>100000)throw Error('Неверное число строк '+n);const lines=[];for(let j=0;j<n;j++){const k=this.i();if(k<0||k>2000000)throw Error('Неверная длина строки '+k);this.need(k*2);const t=this.decoder.decode(new Uint8Array(this.b.buffer,this.b.byteOffset+this.pos,k*2));this.pos+=k*2;lines.push(t.trim())}return lines.filter(Boolean).join('\n')}
vlist(){const n=this.i();this.u();if(n<0||n>1000000)throw Error('Неверный список значений');this.skip(n*4);return n}
}
function delta(r){const value=r.i(),view=r.u(),mode=r.u(),expr=r.tf(),crit=r.tf();r.tf();r.tf();r.tf();return {value,view,mode,expr,crit}}
function gate(r){const min=r.i(),max=r.i(),v=r.vlist(),m=r.vlist();return {min,max,v,m}}
function parseQmm(buf){
const r=new Reader(buf),ver=r.i();if(![1111111125,1111111126,1111111127].includes(ver))throw Error('Неподдерживаемая версия QMM: '+ver);
if(ver>=1111111127){r.i();r.i();r.tf()}
r.skip(5);for(let i=0;i<7;i++)r.i();
const np=r.i();if(np<0||np>1000)throw Error('Неверное число параметров');
const pars=[];for(let i=0;i<np;i++){const p={min:r.i(),max:r.i(),type:r.i()};r.u();r.u();p.enabled=r.u();const nv=r.i();r.u();p.name=r.tf();p.views=[];if(nv<0||nv>100000)throw Error('Неверные представления');for(let j=0;j<nv;j++){r.i();r.i();p.views.push(r.tf())}p.crit=r.tf();r.tf();r.tf();r.tf();p.start=r.tf();pars.push(p)}
for(let i=0;i<7;i++)r.tf();
const nl=r.i(),npaths=r.i();if(nl<0||nl>100000||npaths<0||npaths>1000000)throw Error('Неверное число локаций или путей');
const success=r.tf(),description=r.tf(),locations=[];
for(let i=0;i<nl;i++){const days=r.i(),x=r.i(),y=r.i(),num=r.i();const visits=ver>=1111111126?r.i():0,flags=r.u(),nd=r.i(),deltas=[];if(nd<0||nd>10000)throw Error('Неверные дельты');for(let j=0;j<nd;j++){const par=r.i();deltas.push({par,...delta(r)})}
const count=r.i(),texts=[];if(count<0||count>100000)throw Error('Неверное число описаний');for(let j=0;j<count;j++){texts.push(r.tf());r.tf();r.tf();r.tf()}const random=!!r.u();const order=r.tf();locations.push({num,x,y,days,visits,flags,texts,random,order,deltas,paths:[]})}
const paths=[];for(let i=0;i<npaths;i++){r.skip(8);const flags=r.i(),num=r.i(),from=r.i(),to=r.i(),always=r.u(),passes=r.i(),showOrder=r.i(),ng=r.i(),gates=[];if(ng<0||ng>10000)throw Error('Неверные условия');for(let j=0;j<ng;j++){const par=r.i();gates.push({par,...gate(r)})}const nd=r.i(),deltas=[];if(nd<0||nd>10000)throw Error('Неверные эффекты');for(let j=0;j<nd;j++){const par=r.i();deltas.push({par,...delta(r)})}
const logic=r.tf(),text=r.tf(),end=r.tf();r.tf();r.tf();r.tf();paths.push({num,from,to,flags,always,passes,showOrder,gates,deltas,logic,text,end})}
if(r.pos!==r.b.byteLength)throw Error('QMM разобран не полностью: '+r.pos+' / '+r.b.byteLength);
const map=new Map(locations.map(l=>[l.num,l]));for(const p of paths)if(map.has(p.from))map.get(p.from).paths.push(p);
return {ver,pars,description,success,locations,paths,map}
}
function showList(){const filter=$('filter').value.toLowerCase();$('list').innerHTML=files.filter(f=>nm(f).toLowerCase().includes(filter)).map(f=>'<button class="item '+(f===selected?'active':'')+'" data-file="'+esc(f)+'">'+esc(nm(f))+'</button>').join('');$('list').querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>load(b.dataset.file))}
async function load(file){selected=file;q=null;showList();$('status').textContent='Загружаю QMM '+nm(file)+'…';$('content').innerHTML='';try{const res=await fetch(base+file);if(!res.ok)throw Error('HTTP '+res.status+' — '+res.url);q=parseQmm(await res.arrayBuffer());locs=q.map;history=[];const nums=q.locations.map(l=>l.num).sort((a,b)=>a-b);$('jump').innerHTML=nums.map(n=>'<option value="'+n+'">Loc'+n+'</option>').join('');const start=q.locations.find(l=>l.flags===1)?.num??(nums.includes(1)?1:nums[0]);show(start,false)}catch(e){$('status').innerHTML='<span class="error">'+esc(e.message)+'</span>';console.error(e)}}
function show(n,save=true){if(!q||!locs.has(n))return;if(save)history.push(here);here=n;const l=locs.get(n);$('jump').value=n;$('status').textContent=nm(selected)+' · Loc'+n+' · '+q.locations.length+' локаций, '+q.paths.length+' переходов';let text='<section class="variant"><small>Описание '+(l.texts.length>1?'1 из '+l.texts.length:'локации')+'</small><div class="prose">'+esc(l.texts[0]||'')+'</div></section>'+(l.texts.length>1?'<details><summary>Другие варианты описания ('+(l.random?'случайный выбор':'выбор по выражению')+')</summary>'+l.texts.map((t,i)=>'<div class="variant"><small>Вариант '+(i+1)+'</small><div class="prose">'+esc(t)+'</div></div>').join('')+'</details>':'');if(!l.texts.some(Boolean))text='<p class="muted">Пустая локация: в QMM нет описания.</p>';
let paths=l.paths.slice().sort((a,b)=>a.showOrder-b.showOrder).map(p=>'<div class="choice"><button data-to="'+p.to+'" style="border:0;background:transparent;padding:0;text-align:left;width:100%">'+esc(p.text||'Продолжить (пустой переход)')+'</button><details><summary>Path'+p.num+' → Loc'+p.to+' · условия и эффекты</summary><small>Логика: '+esc(p.logic||'нет')+'; лимит: '+p.passes+'<pre>'+esc(JSON.stringify({gates:p.gates,deltas:p.deltas},null,2))+'</pre></small></details>'+(p.end?'<details><summary>Текст после перехода</summary><div class="prose">'+esc(p.end)+'</div></details>':'')+'</div>').join('');
$('content').innerHTML='<div class="card"><h2>Локация '+n+(l.flags===2?' · техническая пустая':l.flags===1?' · старт':l.flags===3?' · успех':l.flags>=4?' · провал':'')+'</h2>'+text+'<h3>Переходы</h3>'+(paths||'<p class="muted">Переходов нет</p>')+'</div>';$('content').querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>show(+b.dataset.to));}
$('filter').oninput=showList;$('jump').onchange=e=>show(+e.target.value);$('back').onclick=()=>{if(history.length)show(history.pop(),false)};$('home').onclick=()=>{if(q){history=[];show((q.locations.find(l=>l.flags===1)||q.locations[0]).num,false)}};$('one').onclick=()=>show(here,false);
$('all').onclick=()=>{if(!q)return;$('content').innerHTML='<div class="card"><h2>Все тексты '+esc(nm(selected))+'</h2>'+q.locations.map(l=>'<h3>Loc'+l.num+'</h3>'+l.texts.map(t=>'<div class="prose">'+esc(t)+'</div>').join('')+'<hr>').join('')+'</div>'};
function graphClean(t){return String(t||'').replace(/<[^>]*>/g,'').replace(/\[[^\]]{1,25}\]/g,'').replace(/\s+/g,' ').trim()}
function graphShort(t,n){t=graphClean(t);return t.length>n?t.slice(0,n-1).trimEnd()+'…':t}
function graphRender(){
if(!q)return;
const nodes=q.locations, xs=nodes.map(l=>l.x),ys=nodes.map(l=>l.y),minX=Math.min(...xs),minY=Math.min(...ys),maxX=Math.max(...xs),maxY=Math.max(...ys);
const rawRange=Math.max(maxX-minX,maxY-minY),factor=rawRange>100000?.005:rawRange>15000?.04:rawRange>5000?.15:rawRange<10?130:1;
const nw=204,nh=78,coords=new Map(),minGapX=360,minGapY=205;
const ordered=[...nodes].sort((a,b)=>a.y-b.y||a.x-b.x||a.num-b.num);
const uniqueX=[...new Set(nodes.map(l=>l.x))].sort((a,b)=>a-b);
const uniqueY=[...new Set(nodes.map(l=>l.y))].sort((a,b)=>a-b);
const rankX=new Map(uniqueX.map((x,i)=>[x,i])),rankY=new Map(uniqueY.map((y,i)=>[y,i]));
const occupied=new Set();
for(const l of ordered){let col=rankX.get(l.x),row=rankY.get(l.y);
if(uniqueX.length>30||uniqueY.length>30){col=Math.round((l.x-minX)*factor/minGapX);row=Math.round((l.y-minY)*factor/minGapY)}
while(occupied.has(col+','+row))row++;
occupied.add(col+','+row);coords.set(l.num,{x:110+col*minGapX,y:120+row*minGapY})}
const width=Math.max(...[...coords.values()].map(p=>p.x))+nw+210,height=Math.max(...[...coords.values()].map(p=>p.y))+nh+180;
const grouped=new Map();for(const p of q.paths){const key=p.from+'|'+p.to;if(!grouped.has(key))grouped.set(key,[]);grouped.get(key).push(p)}
let lines='',blocks='',edgeIndex=0;
for(const [key,paths] of grouped){
const p=paths[0],a=coords.get(p.from),b=coords.get(p.to);if(!a||!b)continue;
const msg=paths.map(x=>graphClean(x.text)||'Без реплики').join(' / ');
const label=graphShort(msg,64),tip=paths.map(x=>'Path'+x.num+': '+(graphClean(x.text)||'Пустой переход')).join('\n');
const id='edge'+(edgeIndex++),self=p.from===p.to;
let d,lx,ly;
if(self){d='M'+(a.x+nw*.72)+' '+a.y+' C'+(a.x+nw*.72)+' '+(a.y-85)+' '+(a.x+nw*.20)+' '+(a.y-85)+' '+(a.x+nw*.20)+' '+a.y;lx=a.x+nw*.46;ly=a.y-65}
else{const x1=a.x+nw/2,y1=a.y+nh/2,x2=b.x+nw/2,y2=b.y+nh/2,dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;const ux=dx/len,uy=dy/len;const sx=x1+ux*105,sy=y1+uy*42,ex=x2-ux*105,ey=y2-uy*42;const offset=(paths.length>1?18:0);d='M'+sx+' '+sy+' Q'+((sx+ex)/2-uy*offset)+' '+((sy+ey)/2+ux*offset)+' '+ex+' '+ey;lx=(sx+ex)/2-uy*(offset/2);ly=(sy+ey)/2+ux*(offset/2)}
const lw=175,lh=43;lines+='<g data-edge="'+esc(key)+'" style="cursor:pointer"><title>'+esc(tip)+'</title><path d="'+d+'" fill="none" stroke="'+(self?'#c5a3ed':'#7b9ecb')+'" stroke-width="2" marker-end="url(#arr)"/><rect x="'+(lx-lw/2)+'" y="'+(ly-lh/2)+'" width="'+lw+'" height="'+lh+'" rx="7" fill="#132238" stroke="#425d7b" opacity=".96"/><foreignObject x="'+(lx-lw/2+5)+'" y="'+(ly-lh/2+3)+'" width="'+(lw-10)+'" height="'+(lh-6)+'"><div xmlns="http://www.w3.org/1999/xhtml" style="font:11px/1.2 system-ui;color:#d9e9ff;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical">'+esc(label)+'</div></foreignObject></g>';
}
for(const l of nodes){const a=coords.get(l.num),excerpt=graphShort(l.texts.find(Boolean)||'',112),isVoid=l.flags===2||!excerpt;blocks+='<g data-node="'+l.num+'" style="cursor:pointer"><title>'+esc('Loc'+l.num+'\n'+graphClean(l.texts[0]||'').slice(0,550))+'</title><rect x="'+a.x+'" y="'+a.y+'" width="'+nw+'" height="'+nh+'" rx="10" fill="'+(l.num===here?'#287eac':isVoid?'#283244':'#29415f')+'" stroke="'+(l.num===here?'#d2edff':'#8cafd2')+'" stroke-width="'+(l.num===here?2.5:1)+'"/><text x="'+(a.x+10)+'" y="'+(a.y+18)+'" fill="#fff" font-size="13" font-weight="bold">Loc'+l.num+(l.flags===2?' · пустая':'')+'</text><foreignObject x="'+(a.x+9)+'" y="'+(a.y+25)+'" width="'+(nw-18)+'" height="'+(nh-30)+'"><div xmlns="http://www.w3.org/1999/xhtml" style="font:11px/1.28 system-ui;color:#e1ecf8;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical">'+esc(excerpt||'Технический узел')+'</div></foreignObject></g>'}
$('graphCanvas').innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="'+Math.max(350,Math.round(width*scale))+'" height="'+Math.max(300,Math.round(height*scale))+'" viewBox="0 0 '+width+' '+height+'"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7b9ecb"/></marker></defs>'+lines+blocks+'</svg>';
$('graphCanvas').querySelectorAll('[data-node]').forEach(g=>g.onclick=()=>{show(+g.dataset.node);$('graph').classList.remove('open')});
$('graphCanvas').querySelectorAll('[data-edge]').forEach(g=>g.onclick=()=>{const [from,to]=g.dataset.edge.split('|').map(Number);show(to);$('graph').classList.remove('open')});
}
function graphZoom(next,clientX,clientY){
const canvas=$('graphCanvas'),rect=canvas.getBoundingClientRect(),x=(clientX??(rect.left+rect.width/2))-rect.left,y=(clientY??(rect.top+rect.height/2))-rect.top;
const old=scale;scale=Math.max(.12,Math.min(5,next));if(Math.abs(scale-old)<.0001)return;
const px=(canvas.scrollLeft+x)/old,py=(canvas.scrollTop+y)/old;graphRender();
canvas.scrollLeft=px*scale-x;canvas.scrollTop=py*scale-y;
}
$('graphOpen').onclick=()=>{if(!q)return;$('graph').classList.add('open');scale=1;graphRender()};
$('graphClose').onclick=()=>$('graph').classList.remove('open');
$('zoomIn').onclick=()=>graphZoom(scale*1.25);
$('zoomOut').onclick=()=>graphZoom(scale/1.25);
$('zoomFit').onclick=()=>{const svg=$('graphCanvas').querySelector('svg');if(!svg)return;const canvas=$('graphCanvas');graphZoom(scale*Math.min(canvas.clientWidth/svg.width.baseVal.value,canvas.clientHeight/svg.height.baseVal.value)*.94,canvas.getBoundingClientRect().left,canvas.getBoundingClientRect().top);canvas.scrollLeft=0;canvas.scrollTop=0};
$('graphCanvas').addEventListener('wheel',e=>{if(!$('graph').classList.contains('open'))return;e.preventDefault();graphZoom(scale*Math.exp(-e.deltaY*.0015),e.clientX,e.clientY)},{passive:false});
let pinch=null;
function touchDistance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
$('graphCanvas').addEventListener('touchstart',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];pinch={distance:touchDistance(a,b),scale};e.preventDefault()}},{passive:false});
$('graphCanvas').addEventListener('touchmove',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];if(!pinch)pinch={distance:touchDistance(a,b),scale};const midX=(a.clientX+b.clientX)/2,midY=(a.clientY+b.clientY)/2;graphZoom(pinch.scale*touchDistance(a,b)/Math.max(1,pinch.distance),midX,midY);e.preventDefault()}},{passive:false});
$('graphCanvas').addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null},{passive:true});
(async()=>{try{const r=await fetch('https://api.github.com/repos/'+repo+'/git/trees/main?recursive=1');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();files=d.tree.filter(x=>x.type==='blob'&&x.path.startsWith(prefix)&&x.path.endsWith('.qmm')).map(x=>x.path.slice(prefix.length)).sort((a,b)=>nm(a).localeCompare(nm(b),'ru'));showList();$('status').textContent='Найдено QMM: '+files.length+'. Выберите квест.'}catch(e){$('list').innerHTML='<span class="error">'+esc(e.message)+'</span>'}})();
</script></body></html>
