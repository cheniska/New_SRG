name: Publish New SRG wiki

on:
  push:
    branches: [main]
    paths:
      - 'GameDoc/**'
      - 'wiki-site/**'
      - 'tools/docs/**'
      - 'index.html'
      - 'wiki/**'
      - '.github/workflows/wiki-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate lore and chronology
        run: |
          python tools/docs/check_lore_structure.py
          python -m unittest discover -s tools/docs -p 'test_chronology.py'
      - name: Build static wiki
        working-directory: wiki-site
        run: node export-github.mjs ../.pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${ARTIFACT_NAME}" --jq '.total_count')
            if [ "$count" = 1 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact is unavailable or ambiguous"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
